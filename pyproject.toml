[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skygym"
version = "0.3.0"
description = "SkyGym - a Gymnasium playground where a drone flies and recon sensors corrupt the truth: synthetic az/el/range/threat-ID detection streams with hidden ground truth, and a Stone Soup tracking baseline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ARYAN2302" }]
keywords = ["gymnasium", "counter-uas", "synthetic-data", "radar", "tracking", "drone"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
tracking = ["stonesoup>=1.0"]
data = ["pandas>=2.0", "pyarrow>=14.0"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "pandas>=2.0", "matplotlib>=3.7", "stonesoup>=1.0"]

[tool.setuptools.packages.find]
include = ["skygym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
